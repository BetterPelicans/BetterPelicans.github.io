<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#F2EBD9"/>
  
  <!-- BICYCLE - Rear Wheel -->
  <g id="bicycle">
    <g id="rear-wheel">
      <circle cx="220" cy="460" r="90" fill="none" stroke="#333333" stroke-width="10"/>
      <circle cx="220" cy="460" r="82" fill="none" stroke="#CCCCCC" stroke-width="2"/>
      <circle cx="220" cy="460" r="6" fill="#555555"/>
      <g stroke="#CCCCCC" stroke-width="2">
        <line x1="220" y1="370" x2="220" y2="550"/>
        <line x1="130" y1="460" x2="310" y2="460"/>
        <line x1="157" y1="397" x2="283" y2="523"/>
        <line x1="283" y1="397" x2="157" y2="523"/>
        <line x1="137" y1="430" x2="303" y2="490"/>
        <line x1="303" y1="430" x2="137" y2="490"/>
        <line x1="185" y1="375" x2="255" y2="545"/>
        <line x1="255" y1="375" x2="185" y2="545"/>
      </g>
    </g>
    
    <!-- BICYCLE - Front Wheel -->
    <g id="front-wheel">
      <circle cx="580" cy="460" r="90" fill="none" stroke="#333333" stroke-width="10"/>
      <circle cx="580" cy="460" r="82" fill="none" stroke="#CCCCCC" stroke-width="2"/>
      <circle cx="580" cy="460" r="6" fill="#555555"/>
      <g stroke="#CCCCCC" stroke-width="2">
        <line x1="580" y1="370" x2="580" y2="550"/>
        <line x1="490" y1="460" x2="670" y2="460"/>
        <line x1="517" y1="397" x2="643" y2="523"/>
        <line x1="643" y1="397" x2="517" y2="523"/>
        <line x1="497" y1="430" x2="663" y2="490"/>
        <line x1="663" y1="430" x2="497" y2="490"/>
        <line x1="545" y1="375" x2="615" y2="545"/>
        <line x1="615" y1="375" x2="545" y2="545"/>
      </g>
    </g>
    
    <!-- BICYCLE - Frame -->
    <g id="frame" fill="none" stroke="#555555" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <!-- Chainstay -->
      <line x1="220" y1="460" x2="330" y2="460"/>
      <!-- Seat tube -->
      <line x1="330" y1="460" x2="350" y2="330"/>
      <!-- Seat stay -->
      <line x1="220" y1="460" x2="350" y2="330"/>
      <!-- Top tube -->
      <line x1="350" y1="330" x2="540" y2="330"/>
      <!-- Down tube -->
      <line x1="330" y1="460" x2="540" y2="330"/>
      <!-- Head tube -->
      <line x1="540" y1="330" x2="560" y2="370"/>
      <!-- Fork -->
      <line x1="560" y1="370" x2="580" y2="460"/>
    </g>
    
    <!-- BICYCLE - Handlebar stem and handlebars -->
    <g id="handlebars" fill="none" stroke="#555555" stroke-width="7" stroke-linecap="round">
      <line x1="540" y1="330" x2="555" y2="295"/>
      <path d="M525 285 Q555 270 585 290" stroke-width="8"/>
    </g>
    
    <!-- BICYCLE - Saddle -->
    <g id="saddle">
      <path d="M330 330 L370 330 Q375 330 375 322 L375 318 Q375 312 370 312 L330 312 Q320 312 320 322 L320 330 Z" fill="#333333"/>
      <line x1="345" y1="312" x2="345" y2="330" stroke="#555555" stroke-width="4"/>
    </g>
    
    <!-- BICYCLE - Crank and pedals -->
    <g id="crank-pedals">
      <circle cx="330" cy="460" r="16" fill="none" stroke="#555555" stroke-width="5"/>
      <circle cx="330" cy="460" r="5" fill="#555555"/>
      <!-- Crank arm back -->
      <line x1="330" y1="460" x2="300" y2="490" stroke="#555555" stroke-width="6" stroke-linecap="round"/>
      <!-- Pedal back -->
      <rect x="290" y="486" width="24" height="8" rx="2" fill="#333333" transform="rotate(-15 302 490)"/>
      <!-- Crank arm front -->
      <line x1="330" y1="460" x2="360" y2="430" stroke="#555555" stroke-width="6" stroke-linecap="round"/>
      <!-- Pedal front -->
      <rect x="350" y="426" width="24" height="8" rx="2" fill="#333333" transform="rotate(-15 362 430)"/>
    </g>
    
    <!-- BICYCLE - Chain ring and chain -->
    <g id="drivetrain">
      <circle cx="330" cy="460" r="26" fill="none" stroke="#555555" stroke-width="3"/>
      <circle cx="330" cy="460" r="20" fill="none" stroke="#777777" stroke-width="1.5"/>
      <path d="M356 460 L220 460" stroke="#777777" stroke-width="2" stroke-dasharray="3,2"/>
    </g>
  </g>
  
  <!-- PELICAN - Far leg -->
  <g id="pelican-far-leg">
    <path d="M330 370 Q320 410 300 490" fill="none" stroke="#E67E22" stroke-width="7" stroke-linecap="round"/>
    <path d="M292 486 L308 494 L312 486 L296 478 Z" fill="#E67E22"/>
  </g>
  
  <!-- PELICAN - Body -->
  <g id="pelican-body">
    <!-- Tail feathers -->
    <path d="M240 320 Q210 300 190 310 Q200 330 220 340 Q230 335 240 320" fill="#FDFBF7"/>
    <path d="M240 320 Q215 280 185 285 Q195 310 220 330" fill="#FDFBF7"/>
    
    <!-- Main body -->
    <ellipse cx="330" cy="310" rx="95" ry="65" fill="#FDFBF7"/>
    
    <!-- Belly -->
    <ellipse cx="320" cy="340" rx="70" ry="45" fill="#F5F0E6"/>
    
    <!-- Wing (folded, dark tips) -->
    <g id="wing">
      <path d="M280 270 Q330 250 390 280 Q400 290 395 310 Q350 340 280 320 Q260 300 280 270 Z" fill="#FDFBF7"/>
      <path d="M370 280 Q395 290 395 310 Q350 335 300 320 Q340 300 370 280 Z" fill="#2B2B2B"/>
      <path d="M280 270 Q300 260 320 265 Q300 280 280 290 Z" fill="#E8E0D0"/>
    </g>
  </g>
  
  <!-- PELICAN - Neck and head -->
  <g id="pelican-head-neck">
    <!-- Neck -->
    <path d="M380 280 Q420 250 450 230 Q460 220 465 210 L475 215 Q480 225 470 240 Q440 270 400 300 Z" fill="#FDFBF7"/>
    
    <!-- Head -->
    <ellipse cx="470" cy="215" rx="28" ry="24" fill="#FDFBF7"/>
    
    <!-- Eye -->
    <circle cx="478" cy="210" r="5" fill="#F1C40F"/>
    <circle cx="479" cy="209" r="3" fill="#2B2B2B"/>
    
    <!-- Beak - upper -->
    <path d="M490 205 L560 215 L490 222 Z" fill="#FFB347"/>
    <line x1="490" y1="213" x2="555" y2="216" stroke="#D35400" stroke-width="1.5"/>
    
    <!-- Beak - lower and pouch -->
    <path d="M490 222 L545 217 L490 235 Q470 240 460 230 Q465 225 490 222 Z" fill="#D35400"/>
    <path d="M490 235 Q510 250 530 240 Q505 245 490 235 Z" fill="#E67E22"/>
    
    <!-- Head crest -->
    <path d="M450 195 Q460 185 470 190 Q475 195 470 200" fill="#FDFBF7" stroke="#E8E0D0" stroke-width="1.5"/>
  </g>
  
  <!-- PELICAN - Far wing reaching handlebars -->
  <g id="pelican-far-wing">
    <path d="M390 280 Q440 260 500 270 Q530 275 545 285" fill="none" stroke="#FDFBF7" stroke-width="18" stroke-linecap="round"/>
    <path d="M530 278 Q545 285 550 290" fill="none" stroke="#2B2B2B" stroke-width="10" stroke-linecap="round"/>
  </g>
  
  <!-- PELICAN - Near wing reaching handlebars -->
  <g id="pelican-near-wing">
    <path d="M350 300 Q420 290 490 285 Q530 282 555 290" fill="none" stroke="#FDFBF7" stroke-width="14" stroke-linecap="round"/>
    <path d="M535 285 Q555 290 560 293" fill="none" stroke="#2B2B2B" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- PELICAN - Near leg and webbed foot on pedal -->
  <g id="pelican-near-leg">
    <path d="M350 370 Q355 400 360 430" fill="none" stroke="#E67E22" stroke-width="7" stroke-linecap="round"/>
    <path d="M352 428 L372 432 L368 424 L350 420 Z" fill="#E67E22"/>
    <!-- Webbing -->
    <path d="M350 420 Q358 418 352 428" fill="#E67E22"/>
    <path d="M352 428 Q362 426 368 424" fill="#E67E22"/>
  </g>
  
  <!-- PELICAN - Far foot on back pedal -->
  <g id="pelican-far-foot">
    <path d="M296 486 L310 490 L306 482 L292 478 Z" fill="#E67E22"/>
    <path d="M296 486 Q302 484 300 490" fill="#E67E22"/>
  </g>
</svg>