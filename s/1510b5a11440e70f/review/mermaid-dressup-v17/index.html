<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mermaid Dress-Up Prototype v17</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #eff4fa;
  --panel: #ffffff;
  --ink: #334055;
  --muted: #6f7c93;
  --accent: #6aa8ff;
  --accent2: #ff7bbb;
  --shadow: 0 10px 28px rgba(40,60,95,.12);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(180deg, #f7fbff 0%, #edf3fb 100%);
  color: var(--ink);
}
header {
  padding: 16px 18px 8px;
}
header h1 {
  margin: 0 0 6px;
  font-size: clamp(24px, 3vw, 34px);
}
header p {
  margin: 0;
  color: var(--muted);
}
.layout {
  display: grid;
  grid-template-columns: minmax(320px, 44vw) 1fr;
  gap: 18px;
  padding: 10px 18px 22px;
  align-items: start;
}
.stageCard, .panel {
  background: var(--panel);
  border-radius: 22px;
  box-shadow: var(--shadow);
}
.stageCard {
  padding: 16px;
  position: sticky;
  top: 10px;
}
.stageWrap {
  position: relative;
  width: 100%;
  max-width: 460px;
  aspect-ratio: 2 / 3;
  margin: 0 auto 14px;
  background:
    linear-gradient(45deg,#f2f2f2 25%, transparent 25%, transparent 75%, #f2f2f2 75%, #f2f2f2),
    linear-gradient(45deg,#f2f2f2 25%, transparent 25%, transparent 75%, #f2f2f2 75%, #f2f2f2);
  background-size: 28px 28px;
  background-position: 0 0, 14px 14px;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid rgba(100,120,160,.14);
}
.stageWrap img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
}
.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}
.controls button, .toggle {
  border: 0;
  background: #f0f5fc;
  color: var(--ink);
  padding: 12px 14px;
  border-radius: 14px;
  font-weight: 700;
  box-shadow: 0 2px 0 rgba(30,50,80,.06) inset;
}
.controls button.primary { background: linear-gradient(180deg, #84b8ff, #6fa9ff); color: white; }
.toggle { display:flex; align-items:center; gap:8px; }
.toggle input { accent-color: #6fa9ff; transform: scale(1.15); }
.panel {
  padding: 14px;
}
.tabs {
  display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;
}
.tab {
  border:0; padding:10px 14px; border-radius: 999px; background:#eef4fb; color: var(--ink);
  font-weight: 800; cursor:pointer;
}
.tab.active { background: linear-gradient(180deg,#ffabd4,#ff88c1); color:white; }
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 12px;
}
.option {
  border: 2px solid transparent;
  background: #f7fbff;
  border-radius: 18px;
  padding: 8px;
  cursor: pointer;
  text-align: center;
}
.option.active { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(106,168,255,.14); }
.option img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  border-radius: 14px;
  background:
    linear-gradient(45deg,#f2f2f2 25%, transparent 25%, transparent 75%, #f2f2f2 75%, #f2f2f2),
    linear-gradient(45deg,#f2f2f2 25%, transparent 25%, transparent 75%, #f2f2f2 75%, #f2f2f2);
  background-size: 18px 18px;
  background-position: 0 0, 9px 9px;
}
.option .label { margin-top: 8px; font-size: 14px; font-weight: 700; }
.dev {
  margin-top: 16px;
  background: #f7fafe;
  border-radius: 16px;
  padding: 12px;
  color: var(--muted);
  font-size: 14px;
}
.dev strong { color: var(--ink); }
.dev code { background: white; padding: 2px 6px; border-radius: 7px; }
.noteLink {
  display:inline-block;
  margin-top: 8px;
  color: #4f79d3;
  text-decoration: none;
  font-weight: 700;
}
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .stageCard { position: static; }
  .stageWrap { max-width: 380px; }
}
</style>
</head>
<body>
<header>
  <h1>Mermaid Dress-Up Prototype</h1>
  <p>Built from a blank base using iterative image generation plus overlay extraction. Optimised for iPad portrait first.</p>
</header>

<div class="layout">
  <section class="stageCard">
    <div class="stageWrap" id="stageWrap">
      <img id="baseLayer" src="assets/base/blank-mermaid-base.png" alt="Base mermaid">
      <img id="tailLayer" alt="Tail option">
      <img id="topLayer" alt="Top option">
      <img id="eyesLayer" alt="Eyes option">
      <img id="mouthLayer" alt="Mouth option">
      <img id="hairLayer" alt="Hair option">
      <img id="crownLayer" alt="Crown option">
      <img id="debugLayer" alt="Debug layer" style="display:none;">
    </div>
    <div class="controls">
      <button class="primary" id="randomBtn">Randomise</button>
      <button id="resetBtn">Reset</button>
      <button id="saveBtn">Save image</button>
      <label class="toggle"><input type="checkbox" id="debugToggle"> Dev mode</label>
    </div>
    <div class="dev" id="devPanel" style="display:none;">
      <strong>Current stack</strong>
      <div id="stackInfo"></div>
      <div style="margin-top:8px;">
        <label><strong>Inspect layer:</strong>
          <select id="inspectSelect">
            <option value="">Composite</option>
            <option value="tail">Tail</option>
            <option value="top">Top</option>
            <option value="eyes">Eyes</option>
            <option value="mouth">Mouth</option>
            <option value="hair">Hair</option>
            <option value="crown">Crown</option>
          </select>
        </label>
      </div>
      <a class="noteLink" href="docs/HERMES-PIPELINE-NOTES.md" target="_blank">Open Hermes pipeline notes</a>
    </div>
  </section>

  <section class="panel">
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="optionsGrid"></div>
  </section>
</div>

<script>
const manifest = {"version":"v17","canvas":{"width":1024,"height":1536},"base":"assets/base/blank-mermaid-base.png","layerOrder":["tail","top","eyes","mouth","hair","crown"],"categories":{"hair":[{"name":"Short Bob","file":"assets/layers/hair/hair-short-bob.png","thumb":"assets/thumbs/hair-short-bob-thumb.png"},{"name":"Short Black Bob","file":"assets/layers/hair/hair-short-black.png","thumb":"assets/thumbs/hair-short-black-thumb.png"},{"name":"Long Blonde","file":"assets/layers/hair/hair-long-blonde.png","thumb":"assets/thumbs/hair-long-blonde-thumb.png"},{"name":"Pink Bob","file":"assets/layers/hair/hair-pink-bob.png","thumb":"assets/thumbs/hair-pink-bob-thumb.png"}],"eyes":[{"name":"Aqua","file":"assets/layers/eyes/eyes-aqua.png","thumb":"assets/thumbs/eyes-aqua-thumb.png"},{"name":"Violet","file":"assets/layers/eyes/eyes-violet.png","thumb":"assets/thumbs/eyes-violet-thumb.png"},{"name":"Amber","file":"assets/layers/eyes/eyes-amber.png","thumb":"assets/thumbs/eyes-amber-thumb.png"}],"mouth":[{"name":"no mouth","file":null,"thumb":"assets/thumbs/mouth-natural-thumb.png"},{"name":"Glossy Pink Lips","file":"assets/layers/mouth/mouth-glossy-pink-lips.png","thumb":"assets/thumbs/mouth-glossy-pink-lips-thumb.png"},{"name":"Berry Lips","file":"assets/layers/mouth/mouth-berry-lips.png","thumb":"assets/thumbs/mouth-berry-lips-thumb.png"}],"top":[{"name":"Mint Scallop","file":"assets/layers/top/top-mint-scallop.png","thumb":"assets/thumbs/top-mint-scallop-thumb.png"},{"name":"Coral Shell","file":"assets/layers/top/top-coral-shell.png","thumb":"assets/thumbs/top-coral-shell-thumb.png"},{"name":"Lavender Scallop","file":"assets/layers/top/top-lavender-scallop.png","thumb":"assets/thumbs/top-lavender-scallop-thumb.png"}],"crown":[{"name":"Gold Crown","file":"assets/layers/crown/crown-gold.png","thumb":"assets/thumbs/crown-gold-thumb.png"},{"name":"Shell Tiara","file":"assets/layers/crown/crown-shell-tiara.png","thumb":"assets/thumbs/crown-shell-tiara-thumb.png"},{"name":"Flower Crown","file":"assets/layers/crown/crown-flower.png","thumb":"assets/thumbs/crown-flower-thumb.png"}],"tail":[{"name":"Original","file":null,"thumb":null},{"name":"Coral","file":"assets/layers/tail/tail-coral.png","thumb":"assets/thumbs/tail-coral-thumb.png"},{"name":"Lavender","file":"assets/layers/tail/tail-lavender.png","thumb":"assets/thumbs/tail-lavender-thumb.png"},{"name":"Mint","file":"assets/layers/tail/tail-mint.png","thumb":"assets/thumbs/tail-mint-thumb.png"}]}};
const categories = ["hair", "eyes", "mouth", "top", "crown", "tail"];
const titleMap = {
  hair: "Hair",
  eyes: "Eyes",
  mouth: "Mouth",
  top: "Top",
  crown: "Crown",
  tail: "Tail Colour"
};
const defaults = {
  hair: 0,
  eyes: 0,
  mouth: 0,
  top: 0,
  crown: 0,
  tail: 0
};
const state = {...defaults, activeTab: "hair"};

const layerEls = {
  tail: document.getElementById("tailLayer"),
  top: document.getElementById("topLayer"),
  eyes: document.getElementById("eyesLayer"),
  mouth: document.getElementById("mouthLayer"),
  hair: document.getElementById("hairLayer"),
  crown: document.getElementById("crownLayer"),
};
const tabsEl = document.getElementById("tabs");
const gridEl = document.getElementById("optionsGrid");
const debugToggle = document.getElementById("debugToggle");
const devPanel = document.getElementById("devPanel");
const stackInfo = document.getElementById("stackInfo");
const inspectSelect = document.getElementById("inspectSelect");
const debugLayer = document.getElementById("debugLayer");

function renderTabs() {
  tabsEl.innerHTML = "";
  categories.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "tab" + (state.activeTab === cat ? " active" : "");
    btn.textContent = titleMap[cat];
    btn.onclick = () => {
      state.activeTab = cat;
      renderTabs();
      renderOptions();
    };
    tabsEl.appendChild(btn);
  });
}

function renderOptions() {
  const cat = state.activeTab;
  const opts = manifest.categories[cat];
  gridEl.innerHTML = "";
  opts.forEach((opt, idx) => {
    const card = document.createElement("button");
    card.className = "option" + (state[cat] === idx ? " active" : "");
    card.onclick = () => {
      state[cat] = idx;
      applyLayers();
      renderOptions();
    };
    let inner = "";
    if (opt.thumb) {
      inner += `<img src="${opt.thumb}" alt="${opt.name}">`;
    } else {
      inner += `<div style="width:100%;aspect-ratio:1/1;border-radius:14px;background:#f4f7fb;display:flex;align-items:center;justify-content:center;font-weight:800;color:#6b7b93;">Original</div>`;
    }
    inner += `<div class="label">${opt.name}</div>`;
    card.innerHTML = inner;
    gridEl.appendChild(card);
  });
}

function applyLayers() {
  categories.forEach(cat => {
    const item = manifest.categories[cat][state[cat]];
    const el = layerEls[cat];
    if (!el) return;
    if (item && item.file) {
      el.src = item.file;
      el.style.display = "block";
    } else {
      el.removeAttribute("src");
      el.style.display = "none";
    }
  });
  updateDebug();
}

function updateDebug() {
  const enabled = debugToggle.checked;
  devPanel.style.display = enabled ? "block" : "none";
  if (!enabled) {
    debugLayer.style.display = "none";
    stackInfo.textContent = "";
    for (const el of Object.values(layerEls)) el.style.opacity = "1";
    return;
  }
  const parts = categories.map(cat => {
    const item = manifest.categories[cat][state[cat]];
    return `<div><strong>${titleMap[cat]}:</strong> ${item.name}</div>`;
  }).join("");
  stackInfo.innerHTML = parts;
  const inspect = inspectSelect.value;
  if (!inspect) {
    debugLayer.style.display = "none";
    for (const [cat, el] of Object.entries(layerEls)) el.style.opacity = "1";
  } else {
    const inspectItem = manifest.categories[inspect][state[inspect]];
    if (inspectItem.file) {
      debugLayer.src = inspectItem.file;
      debugLayer.style.display = "block";
    } else {
      debugLayer.removeAttribute("src");
      debugLayer.style.display = "none";
    }
    for (const [cat, el] of Object.entries(layerEls)) {
      el.style.opacity = cat === inspect ? "0.15" : "0.0";
    }
  }
}

debugToggle.addEventListener("change", updateDebug);
inspectSelect.addEventListener("change", updateDebug);

document.getElementById("randomBtn").onclick = () => {
  categories.forEach(cat => {
    const count = manifest.categories[cat].length;
    state[cat] = Math.floor(Math.random() * count);
  });
  applyLayers();
  renderOptions();
};
document.getElementById("resetBtn").onclick = () => {
  Object.assign(state, defaults);
  applyLayers();
  renderOptions();
};
document.getElementById("saveBtn").onclick = async () => {
  const canvas = document.createElement("canvas");
  canvas.width = manifest.canvas.width;
  canvas.height = manifest.canvas.height;
  const ctx = canvas.getContext("2d");
  const ids = ["baseLayer","tailLayer","topLayer","eyesLayer","mouthLayer","hairLayer","crownLayer"];
  for (const id of ids) {
    const img = document.getElementById(id);
    if (!img.getAttribute("src")) continue;
    await new Promise(resolve => {
      if (img.complete) return resolve();
      img.onload = () => resolve();
    });
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  }
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = "mermaid-dressup.png";
  a.click();
};

renderTabs();
renderOptions();
applyLayers();
</script>
</body>
</html>
