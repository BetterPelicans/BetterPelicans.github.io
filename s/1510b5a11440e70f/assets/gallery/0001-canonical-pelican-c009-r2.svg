<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background -->
  <rect width="800" height="600" fill="#e8f4f8"/>
  
  <!-- Ground -->
  <rect x="0" y="520" width="800" height="80" fill="#c9d6b8"/>
  <line x1="0" y1="520" x2="800" y2="520" stroke="#a0b898" stroke-width="2"/>
  
  <g id="bicycle-and-pelican">
    
    <!-- FAR WHEEL -->
    <g id="far-wheel">
      <circle cx="260" cy="460" r="55" fill="none" stroke="#6b7b8d" stroke-width="4"/>
      <circle cx="260" cy="460" r="8" fill="#6b7b8d"/>
      <line x1="260" y1="405" x2="260" y2="515" stroke="#6b7b8d" stroke-width="2"/>
      <line x1="205" y1="460" x2="315" y2="460" stroke="#6b7b8d" stroke-width="2"/>
      <line x1="221" y1="421" x2="299" y2="499" stroke="#6b7b8d" stroke-width="2"/>
      <line x1="299" y1="421" x2="221" y2="499" stroke="#6b7b8d" stroke-width="2"/>
    </g>
    
    <!-- FAR LEG: two-segment with explicit knee; foot on far pedal -->
    <g id="far-leg">
      <line x1="372" y1="330" x2="408" y2="372" stroke="#d4a060" stroke-width="8" stroke-linecap="round"/>
      <line x1="408" y1="372" x2="427" y2="442" stroke="#d4a060" stroke-width="7" stroke-linecap="round"/>
      <path d="M424 434 Q436 430 446 438 Q442 448 430 446 Q422 442 424 434 Z" fill="#e8b060"/>
    </g>
    
    <!-- FAR CRANK (up-back) -->
    <line x1="440" y1="455" x2="427" y2="442" stroke="#666" stroke-width="5" stroke-linecap="round"/>
    <rect x="418" y="436" width="20" height="7" rx="2" fill="#555" transform="rotate(-20 428 440)"/>
    
    <!-- BICYCLE FRAME -->
    <g id="bicycle-frame">
      <line x1="260" y1="460" x2="380" y2="430" stroke="#4a5a6a" stroke-width="6" stroke-linecap="round"/>
      <line x1="260" y1="460" x2="440" y2="455" stroke="#4a5a6a" stroke-width="6" stroke-linecap="round"/>
      <line x1="380" y1="430" x2="440" y2="455" stroke="#4a5a6a" stroke-width="6" stroke-linecap="round"/>
      <line x1="380" y1="330" x2="380" y2="430" stroke="#4a5a6a" stroke-width="6" stroke-linecap="round"/>
      <line x1="380" y1="330" x2="510" y2="350" stroke="#4a5a6a" stroke-width="6" stroke-linecap="round"/>
      <line x1="510" y1="350" x2="440" y2="455" stroke="#4a5a6a" stroke-width="6" stroke-linecap="round"/>
      <line x1="510" y1="320" x2="510" y2="370" stroke="#4a5a6a" stroke-width="8" stroke-linecap="round"/>
      <line x1="510" y1="370" x2="560" y2="460" stroke="#4a5a6a" stroke-width="5" stroke-linecap="round"/>
      <line x1="260" y1="460" x2="380" y2="330" stroke="#4a5a6a" stroke-width="5" stroke-linecap="round"/>
      <line x1="260" y1="460" x2="440" y2="455" stroke="#4a5a6a" stroke-width="5" stroke-linecap="round"/>
    </g>
    
    <!-- SADDLE: below the belly, clearly visible -->
    <g id="saddle">
      <ellipse cx="355" cy="348" rx="30" ry="10" fill="#3a3a3a"/>
      <rect x="350" y="348" width="10" height="14" fill="#4a5a6a"/>
    </g>
    
    <!-- HANDLEBARS -->
    <g id="handlebars">
      <line x1="510" y1="320" x2="530" y2="310" stroke="#4a5a6a" stroke-width="6" stroke-linecap="round"/>
      <line x1="530" y1="290" x2="530" y2="310" stroke="#4a5a6a" stroke-width="6" stroke-linecap="round"/>
      <line x1="505" y1="290" x2="555" y2="290" stroke="#4a5a6a" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="505" cy="290" rx="6" ry="6" fill="#3a3a3a"/>
      <ellipse cx="555" cy="290" rx="6" ry="6" fill="#3a3a3a"/>
    </g>
    
    <!-- CHAIN RING & CHAIN -->
    <g id="drivetrain">
      <circle cx="440" cy="455" r="18" fill="none" stroke="#666" stroke-width="3"/>
      <circle cx="440" cy="455" r="6" fill="#666"/>
      <line x1="440" y1="437" x2="440" y2="473" stroke="#666" stroke-width="2"/>
      <line x1="422" y1="455" x2="458" y2="455" stroke="#666" stroke-width="2"/>
      <line x1="424" y1="450" x2="268" y2="462" stroke="#666" stroke-width="3" stroke-dasharray="4,3"/>
      <line x1="424" y1="460" x2="268" y2="458" stroke="#666" stroke-width="3" stroke-dasharray="4,3"/>
      <circle cx="260" cy="460" r="9" fill="none" stroke="#777" stroke-width="2"/>
    </g>
    
    <!-- NEAR CRANK & PEDAL (down-forward) -->
    <g id="near-crank">
      <line x1="440" y1="455" x2="455" y2="470" stroke="#666" stroke-width="5" stroke-linecap="round"/>
      <rect x="448" y="466" width="18" height="6" rx="2" fill="#555"/>
    </g>
    
    <!-- NEAR WHEEL -->
    <g id="near-wheel">
      <circle cx="560" cy="460" r="55" fill="none" stroke="#4a5a6a" stroke-width="5"/>
      <circle cx="560" cy="460" r="8" fill="#4a5a6a"/>
      <line x1="560" y1="405" x2="560" y2="515" stroke="#4a5a6a" stroke-width="2.5"/>
      <line x1="505" y1="460" x2="615" y2="460" stroke="#4a5a6a" stroke-width="2.5"/>
      <line x1="521" y1="421" x2="599" y2="499" stroke="#4a5a6a" stroke-width="2.5"/>
      <line x1="599" y1="421" x2="521" y2="499" stroke="#4a5a6a" stroke-width="2.5"/>
      <circle cx="560" cy="460" r="55" fill="none" stroke="#3a4a5a" stroke-width="2" stroke-dasharray="4,6"/>
    </g>
    
    <!-- NEAR LEG: two-segment with explicit knee; foot on near pedal -->
    <g id="near-leg">
      <line x1="398" y1="332" x2="430" y2="366" stroke="#e8b060" stroke-width="9" stroke-linecap="round"/>
      <line x1="430" y1="366" x2="448" y2="454" stroke="#e8b060" stroke-width="8" stroke-linecap="round"/>
      <path d="M446 460 Q458 456 466 464 Q462 474 452 472 Q444 468 446 460 Z" fill="#f0c060"/>
      <path d="M460 464 L468 470" stroke="#d4a040" stroke-width="1.5"/>
      <path d="M456 466 L462 474" stroke="#d4a040" stroke-width="1.5"/>
    </g>
    
    <!-- PELICAN BODY (belly rests on saddle at y=348) -->
    <g id="pelican">
      <!-- Tail feathers -->
      <path d="M290,292 Q260,282 255,307 Q280,312 295,307 Z" fill="#d0d0d0"/>
      <path d="M290,297 Q255,292 250,317 Q275,322 292,314 Z" fill="#c8c8c8"/>
      
      <!-- Body -->
      <ellipse cx="350" cy="292" rx="75" ry="50" fill="#f5f0e8"/>
      <ellipse cx="350" cy="292" rx="75" ry="50" fill="none" stroke="#d8d0c0" stroke-width="1.5"/>
      
      <!-- Body underside shadow -->
      <ellipse cx="355" cy="312" rx="60" ry="28" fill="#e8e0d0" opacity="0.5"/>
      
      <!-- Wing (folded, dark tips) -->
      <g id="wing">
        <path d="M310,267 Q370,252 405,282 Q420,312 395,322 Q360,332 320,312 Q300,292 310,267 Z" fill="#e8e0d0"/>
        <path d="M370,272 Q400,282 410,302 Q415,317 400,322 Q380,312 370,297 Z" fill="#4a4a4a"/>
        <path d="M340,282 Q360,277 375,287" stroke="#d0c8b8" stroke-width="1.5" fill="none"/>
        <path d="M335,297 Q355,290 370,300" stroke="#d0c8b8" stroke-width="1.5" fill="none"/>
      </g>
      
      <!-- Wing controlling handlebar -->
      <g id="wing-handlebar">
        <path d="M390,288 Q440,273 500,286 Q510,293 505,303 Q460,308 420,303 Q395,300 390,288 Z" fill="#f0e8d8"/>
        <path d="M460,283 Q490,286 505,296 Q505,303 498,304 Q485,298 470,293 Z" fill="#4a4a4a"/>
      </g>
      
      <!-- Neck -->
      <path d="M380,260 Q410,230 430,200 Q445,180 455,170" stroke="#f5f0e8" stroke-width="20" fill="none" stroke-linecap="round"/>
      <path d="M380,260 Q410,230 430,200 Q445,180 455,170" stroke="#e8e0d0" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.3"/>
      
      <!-- Head -->
      <ellipse cx="460" cy="160" rx="28" ry="24" fill="#f5f0e8"/>
      
      <!-- Eye -->
      <circle cx="468" cy="154" r="5" fill="#2a2a2a"/>
      <circle cx="469" cy="153" r="1.8" fill="#fff"/>
      
      <!-- Eye ring -->
      <circle cx="468" cy="154" r="7" fill="none" stroke="#e0a030" stroke-width="1.5"/>
      
      <!-- Beak - upper mandible -->
      <path d="M485,155 Q520,148 560,152 Q575,154 580,160 Q560,165 520,165 Q490,163 485,155 Z" fill="#f0a030"/>
      <line x1="485" y1="158" x2="578" y2="158" stroke="#d08020" stroke-width="1"/>
      
      <!-- Beak hook -->
      <path d="M575,155 Q582,158 580,163" fill="#d08020"/>
      
      <!-- Pouch -->
      <path d="M485,162 Q500,175 520,185 Q540,192 555,185 Q565,178 570,168 Q555,175 535,175 Q510,172 490,165 Z" fill="#f0b040"/>
      <path d="M490,163 Q510,170 535,173 Q555,173 568,167" fill="none" stroke="#e0a030" stroke-width="1"/>
      
      <!-- Pouch highlight -->
      <path d="M495,166 Q510,172 525,174" stroke="#f8c860" stroke-width="1.5" fill="none"/>
      
      <!-- Head top highlight -->
      <ellipse cx="455" cy="150" rx="15" ry="8" fill="#fff8f0" opacity="0.4"/>
    </g>
    
    <!-- Small decorative tuft on head -->
    <path d="M440,138 Q445,130 450,132" stroke="#e8d8c0" stroke-width="2" fill="none"/>
    <path d="M445,135 Q450,126 455,130" stroke="#e8d8c0" stroke-width="2" fill="none"/>
    
  </g>
</svg>
